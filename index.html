<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Sentinel</title>
  <style>
    /* Fill the whole window with a dark background and centre the game */
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #101410;
      color: #b8c4b0;
      font-family: monospace;
    }
    h1 {
      margin: 0 0 12px;
      letter-spacing: 4px;
      text-transform: uppercase;
      font-size: 1.5rem;
    }
    /* The canvas is small (320x180) and stretched up.
       image-rendering keeps the pixels sharp instead of blurry. */
    canvas {
      width: min(90vw, 150vh);
      aspect-ratio: 16 / 9;
      image-rendering: pixelated;
      border: 2px solid #3a463a;
      background: #000;
    }
    p {
      margin: 12px 0 0;
      font-size: 0.85rem;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <h1>Project Sentinel</h1>
  <canvas id="game" width="320" height="180"></canvas>
  <p>A / D or arrows = move &nbsp; W / Space = jump &nbsp; C = crouch &nbsp; jump on aliens to squash them &nbsp; J or click = attack &nbsp; mouse wheel or 1 / 2 = switch weapon &nbsp; Enter = next room &nbsp; M = mute &nbsp; R = restart</p>

  <script>
    // =====================================================
    // PROJECT SENTINEL - first playable version
    // Everything is drawn with simple coloured rectangles.
    // =====================================================

    // ---------- Setup ----------
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    // These four change from room to room (see the ROOMS list further down)
    let W = 320;            // width of the whole room in pixels
    let VW = 320;           // how much of the room you can see at once (the "field of view")
    let H = 180;            // height of the view in pixels
    let FLOOR = 150;        // y position of the top of the floor
    let aliensToKill = 8;   // kill this many to clear the room
    const STAND_HEIGHT = 50;  // how tall the Sentinel is standing...
    const CROUCH_HEIGHT = 32; // ...and crouching

    // A second, invisible canvas that remembers blood on the floor and walls.
    // Blood is drawn on it once and stays there, which keeps the game fast.
    const splat = document.createElement("canvas");
    splat.width = W;
    splat.height = H;
    const splatCtx = splat.getContext("2d");

    // A third canvas holds the dark edges of the screen (the "vignette").
    // It is drawn once when a room loads, then pasted on top every frame.
    const vignette = document.createElement("canvas");
    const vctx = vignette.getContext("2d");
    function buildVignette() {
      vignette.width = VW;
      vignette.height = H;
      const fade = vctx.createRadialGradient(VW / 2, H / 2, H * 0.39, VW / 2, H / 2, VW * 0.66);
      fade.addColorStop(0, "rgba(0,0,0,0)");
      fade.addColorStop(1, "rgba(0,0,0,0.6)");
      vctx.fillStyle = fade;
      vctx.fillRect(0, 0, VW, H);
    }

    // ---------- Sound ----------
    // There are no sound files. Every sound is made in code with the browser's
    // Web Audio: a "tone" is a beep that slides from one pitch to another, and
    // "noise" is a burst of hiss (good for bangs, thuds and squelches).
    let audio = null;       // the audio system (made on the first key press or click)
    let muted = false;      // press M to switch the sound off and on
    let noiseBuffer = null; // a second of random hiss that noise sounds are cut from

    // Browsers only allow sound after the player has pressed a key or clicked
    function initAudio() {
      if (audio) {
        if (audio.state === "suspended") audio.resume();
        return;
      }
      try {
        audio = new (window.AudioContext || window.webkitAudioContext)();
        noiseBuffer = audio.createBuffer(1, audio.sampleRate, audio.sampleRate);
        const data = noiseBuffer.getChannelData(0);
        for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
        startAmbience();
      } catch (err) {
        audio = null;       // no sound available: the game still works fine
      }
    }

    // A beep that slides from pitch "from" to pitch "to" (in Hz) and fades out
    function tone(type, from, to, length, volume, delay) {
      if (!audio || muted) return;
      const t = audio.currentTime + (delay || 0);
      const osc = audio.createOscillator();
      const gain = audio.createGain();
      osc.type = type;                                  // "sine", "square", "sawtooth" or "triangle"
      osc.frequency.setValueAtTime(from, t);
      osc.frequency.exponentialRampToValueAtTime(Math.max(to, 1), t + length);
      gain.gain.setValueAtTime(volume, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + length);
      osc.connect(gain);
      gain.connect(audio.destination);
      osc.start(t);
      osc.stop(t + length);
    }

    // A burst of hiss, filtered so it sounds like a bang (low) or a clank (high)
    function noise(filterType, from, to, length, volume, delay) {
      if (!audio || muted) return;
      const t = audio.currentTime + (delay || 0);
      const src = audio.createBufferSource();
      const filter = audio.createBiquadFilter();
      const gain = audio.createGain();
      src.buffer = noiseBuffer;
      filter.type = filterType;                         // "lowpass", "highpass" or "bandpass"
      filter.frequency.setValueAtTime(from, t);
      filter.frequency.exponentialRampToValueAtTime(Math.max(to, 1), t + length);
      gain.gain.setValueAtTime(volume, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + length);
      src.connect(filter);
      filter.connect(gain);
      gain.connect(audio.destination);
      src.start(t);
      src.stop(t + length);
    }

    // Quiet background: a low machine hum that slowly wobbles
    function startAmbience() {
      const hum = audio.createOscillator();
      const hum2 = audio.createOscillator();
      const gain = audio.createGain();
      const wobble = audio.createOscillator();
      const wobbleSize = audio.createGain();
      hum.type = "sine";     hum.frequency.value = 55;
      hum2.type = "triangle"; hum2.frequency.value = 82.5;
      gain.gain.value = 0.035;
      wobble.frequency.value = 0.15;
      wobbleSize.gain.value = 0.015;
      wobble.connect(wobbleSize);
      wobbleSize.connect(gain.gain);
      hum.connect(gain);
      hum2.connect(gain);
      gain.connect(audio.destination);
      hum.start(); hum2.start(); wobble.start();
    }

    // All the game's sounds, in one place so they are easy to find and change
    const sfx = {
      swing()   { noise("bandpass", 1200, 400, 0.1, 0.12); },
      punchHit(){ tone("sine", 140, 45, 0.18, 0.7); noise("lowpass", 900, 150, 0.14, 0.5); },
      shotgun() {
        noise("lowpass", 4000, 250, 0.4, 0.9);
        tone("sine", 110, 30, 0.35, 0.8);
        tone("square", 220, 150, 0.03, 0.15, 0.32);     // pumping the shotgun: two clicks
        tone("square", 160, 110, 0.04, 0.15, 0.42);
      },
      empty()   { tone("square", 320, 260, 0.04, 0.15); },
      stomp()   { tone("sine", 160, 35, 0.3, 0.9); noise("lowpass", 1400, 100, 0.3, 0.7); },
      alienDie(){ noise("bandpass", 500, 90, 0.3, 0.55); tone("sawtooth", 320, 70, 0.25, 0.25); },
      alienHit(){ tone("sawtooth", 520, 200, 0.07, 0.12); },
      screech() { tone("sawtooth", 1500, 500, 0.35, 0.07); tone("square", 1100, 400, 0.3, 0.04); },
      roar()    { tone("sawtooth", 400, 90, 0.6, 0.18); noise("lowpass", 700, 100, 0.5, 0.3); },   // a brute arrives
      hurt()    { tone("square", 110, 55, 0.22, 0.4); noise("lowpass", 1000, 150, 0.15, 0.4); },
      jump()    { tone("triangle", 200, 100, 0.1, 0.25); },
      land(power) {
        tone("sine", 90, 35, 0.2, Math.min(0.8, 0.3 + power / 600));
        noise("highpass", 3000, 1500, 0.06, 0.15);      // a metal clank
      },
      step()    { tone("triangle", 95, 50, 0.1, 0.3); noise("highpass", 2500, 1500, 0.04, 0.12); },
      pickup()  { tone("sine", 600, 600, 0.07, 0.25); tone("sine", 900, 900, 0.1, 0.25, 0.07); },
      death()   { tone("sawtooth", 220, 25, 0.9, 0.5); noise("lowpass", 800, 60, 0.7, 0.5); }
    };

    // ---------- Keyboard and mouse ----------
    const keys = {};        // keys[name] is true while that key is held down
    let punchPressed = false; // set to true when the player attacks (punch or shoot)
    let usedMouse = false;    // true if the last attack was a mouse click (so we aim at the mouse)
    let aimX = W / 2;         // where the mouse is inside the game (0-320)
    let aimY = FLOOR;         // ...and how far down (0-180)
    let lastHitSound = 0;     // stops the "alien hit" sound playing 7 times for one shotgun blast
    let lastWheel = -1;     // stops the wheel switching weapons too fast

    window.addEventListener("keydown", function (e) {
      keys[e.code] = true;
      initAudio();
      if (e.code === "KeyM") muted = !muted;
      if (e.code === "KeyJ") { punchPressed = true; usedMouse = false; }
      if (e.code === "Digit1") selectWeapon(0);
      if (e.code === "Digit2") selectWeapon(1);
      if (e.code === "KeyR") {
        // R restarts the room. After finishing the last room it starts the game again.
        if (state === "cleared" && roomIndex === ROOMS.length - 1) loadRoom(0);
        else loadRoom(roomIndex);
      }
      if (e.code === "Enter" && state === "cleared" && roomIndex < ROOMS.length - 1) nextRoom();
      // stop the page from scrolling when pressing space or arrows
      if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.code)) {
        e.preventDefault();
      }
    });
    window.addEventListener("keyup", function (e) {
      keys[e.code] = false;
    });

    // Work out where the mouse is inside the game picture
    function trackMouse(e) {
      const box = canvas.getBoundingClientRect();
      aimX = (e.clientX - box.left) / box.width * VW;   // position on screen (add camX for the room)
      aimY = (e.clientY - box.top) / box.height * H;
    }
    canvas.addEventListener("mousemove", trackMouse);

    // Clicking the game attacks towards wherever the mouse is
    canvas.addEventListener("mousedown", function (e) {
      initAudio();
      trackMouse(e);
      usedMouse = true;
      punchPressed = true;
    });

    // The mouse wheel scrolls through the weapons (the "weapon scroll")
    window.addEventListener("wheel", function (e) {
      e.preventDefault();
      if (animTime - lastWheel < 0.12) return;   // one weapon per flick of the wheel
      lastWheel = animTime;
      selectWeapon(player.weapon + (e.deltaY > 0 ? 1 : -1));
    }, { passive: false });

    // ---------- Game state ----------
    let player, aliens, particles, state, killed, spawnTimer, hitStop;
    let pellets, pickups;   // shotgun pellets in flight, and shell boxes lying on the floor
    let hudMessage = "", hudMessageTime = 0;   // a short message shown above the weapon bar
    const WEAPONS = ["FISTS", "SHOTGUN"];      // the weapon scroll: index 0 is fists, 1 is the shotgun
    const MAX_SHELLS = 24;
    let shake = 0;          // how long the screen shakes for (seconds)
    let shakePower = 0;     // how hard it shakes (pixels)
    let animTime = 0;       // keeps counting up, used for flickering and dripping
    let camX = 0;           // the camera: how far along the room the view has scrolled
    let roomIndex = 0;      // which room we are in (0 is room 1)
    let platforms = [];     // platforms you can jump onto (you can jump up through them)

    // ---------- The rooms ----------
    // Each room is a list of settings. To make a new room, copy one and change the numbers.
    const ROOMS = [
      {
        name: "LAB 1",
        worldW: 320, viewW: 320, viewH: 180,   // room size, and how much you can see
        floor: 150, startX: 148,
        toKill: 8,                  // aliens to kill to clear the room
        maxAlive: 3,                // most aliens on screen at once
        spawnEvery: 2,              // seconds between new aliens
        bruteEvery: 0,              // every Nth alien is a big brute (0 = none)
        wall: ["#141b16", "#182019", "#1c241e", "#202a22", "#242e26"],
        infested: false,
        platforms: [
          { x: 30,  y: 115, w: 60 },
          { x: 230, y: 110, w: 60 }
        ]
      },
      {
        name: "LAB 2 - THE NEST",
        worldW: 960, viewW: 480, viewH: 270,   // 3x as wide as lab 1, and you see more of it
        floor: 240, startX: 40,
        toKill: 12,
        maxAlive: 4,
        spawnEvery: 1.6,
        bruteEvery: 3,              // every 3rd alien is a brute
        wall: ["#0f1810", "#131c13", "#172216", "#1b261a", "#1f2a1e"],
        infested: true,
        platforms: [                // each one is a short jump above the last
          { x: 60,  y: 205, w: 80 },
          { x: 200, y: 170, w: 70 },
          { x: 340, y: 205, w: 80 },
          { x: 470, y: 170, w: 90 },
          { x: 600, y: 135, w: 70 },
          { x: 730, y: 170, w: 80 },
          { x: 850, y: 205, w: 80 }
        ]
      }
    ];

    // Load a room. "carry" holds the health, shells and weapon to bring from the last room.
    function loadRoom(index, carry) {
      roomIndex = index;
      const r = ROOMS[index];
      W = r.worldW;  VW = r.viewW;  H = r.viewH;  FLOOR = r.floor;
      platforms = r.platforms;
      aliensToKill = r.toKill;
      canvas.width = VW;            // changing the canvas size is how the view gets wider
      canvas.height = H;
      splat.width = W;              // (this also wipes the blood from the last room)
      splat.height = H;
      buildVignette();
      camX = 0;
      player = {
        x: r.startX, y: FLOOR - STAND_HEIGHT, w: 24, h: STAND_HEIGHT,
        vx: 0, vy: 0,
        facing: 1,          // 1 = looking right, -1 = looking left
        onGround: true,
        crouching: false,
        hp: 100,
        punchTime: 0,       // counts up while punching
        punchCooldown: 0,   // also used as the wait between shotgun shots
        hurtTime: 0,        // short invincibility after being hit
        weapon: 0,          // which weapon is selected (see WEAPONS)
        shells: 8,          // shotgun ammunition
        flash: 0,           // muzzle flash timer
        recoil: 0,          // gun kick timer
        blood: []           // blood stains on the armour (see addPlayerBlood)
      };
      if (carry) {
        player.hp = carry.hp;
        player.shells = carry.shells;
        player.weapon = carry.weapon;
        player.blood = carry.blood;         // you stay bloody from room to room
      }
      aliens = [];
      particles = [];
      pellets = [];
      pickups = [];
      killed = 0;
      spawnTimer = 1;
      hitStop = 0;
      shake = 0;
      state = "play";       // "play", "dead" or "cleared"
    }

    // Go on to the next room, with some health back
    function nextRoom() {
      loadRoom(roomIndex + 1, {
        hp: Math.min(100, player.hp + 30),
        shells: player.shells,
        weapon: player.weapon,
        blood: player.blood
      });
    }

    // Start the game. Adding #room2 to the web address jumps straight to room 2.
    function startGame() {
      const wantRoom2 = typeof location !== "undefined" && location.hash === "#room2";
      loadRoom(wantRoom2 ? 1 : 0);
    }

    // The camera follows the Sentinel along a wide room
    function updateCamera(dt) {
      const target = Math.max(0, Math.min(W - VW, player.x + player.w / 2 - VW / 2));
      camX += (target - camX) * Math.min(1, dt * 8);
    }

    // Shake the screen. A stronger shake replaces a weaker one.
    function addShake(time, power) {
      if (shake <= 0 || power >= shakePower) {
        shake = time;
        shakePower = power;
      }
    }

    // ---------- Aliens ----------
    // A normal alien is 16x14. A brute is the same shape drawn twice as big,
    // with three times the health, a harder bite, and slower legs.
    function spawnAlien() {
      const r = ROOMS[roomIndex];
      const sent = killed + aliens.length;   // how many aliens have been sent so far
      const brute = r.bruteEvery > 0 && sent % r.bruteEvery === r.bruteEvery - 1;
      const size = brute ? 2 : 1;
      const fromLeft = Math.random() < 0.5;
      if (brute) sfx.roar(); else sfx.screech();   // a new alien shrieks as it arrives
      // Aliens appear just off the edge of the screen, on whichever side they come from
      aliens.push({
        x: fromLeft ? Math.max(-20 * size, camX - 24 * size) : Math.min(W + 4, camX + VW + 8),
        y: FLOOR - 14 * size,
        w: 16 * size, h: 14 * size,
        scale: size,
        brute: brute,
        vx: 0,
        speed: brute ? 28 + Math.random() * 10 : 35 + Math.random() * 25,
        hp: brute ? 90 : 30,
        maxHp: brute ? 90 : 30,
        damage: brute ? 16 : 8,              // how much a bite hurts
        attackCooldown: 0,
        wobble: Math.random() * 6
      });
    }

    // ---------- Gore and dust ----------
    // Particles are tiny bits of blood, body parts (giblets) or dust.
    function spawnGore(x, y, dir) {
      // small blood droplets
      for (let i = 0; i < 25; i++) {
        particles.push({
          x: x, y: y,
          vx: dir * (30 + Math.random() * 110) + (Math.random() - 0.5) * 60,
          vy: -Math.random() * 120,
          life: 0.6 + Math.random() * 0.8,
          size: 1,
          color: Math.random() < 0.5 ? "#a01010" : "#c42020",
          giblet: false
        });
      }
      // bigger chunks
      for (let i = 0; i < 6; i++) {
        particles.push({
          x: x, y: y,
          vx: dir * (40 + Math.random() * 90) + (Math.random() - 0.5) * 40,
          vy: -40 - Math.random() * 110,
          life: 2.5,
          size: 2 + Math.floor(Math.random() * 2),
          color: Math.random() < 0.5 ? "#7a0c0c" : "#d8b020", // red flesh or yellow eye
          giblet: true
        });
      }
      // never let there be too many (keeps the game fast)
      if (particles.length > 400) particles.splice(0, particles.length - 400);
    }

    // A puff of dust, used when the Sentinel jumps and lands
    function spawnDust(x, y, count) {
      for (let i = 0; i < count; i++) {
        const side = i % 2 === 0 ? -1 : 1;
        particles.push({
          x: x + side * (2 + Math.random() * 6), y: y,
          vx: side * (10 + Math.random() * 30),
          vy: -Math.random() * 14,
          life: 0.3 + Math.random() * 0.25,
          size: 1,
          color: Math.random() < 0.5 ? "#5a625a" : "#7a827a",
          dust: true
        });
      }
    }

    function updateParticles(dt) {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];

        // Dust just drifts and fades away
        if (p.dust) {
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.vx *= 0.95;
          p.life -= dt;
          if (p.life <= 0) particles.splice(i, 1);
          continue;
        }

        p.vy += 500 * dt;           // gravity
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt;

        // Blood flying through the air can land on the Sentinel and stick
        if (!p.giblet && state === "play" &&
            p.x > player.x - 2 && p.x < player.x + player.w + 2 &&
            p.y > player.y && p.y < player.y + player.h) {
          player.blood.push({ dx: Math.floor(p.x - player.x), up: Math.floor(player.y + player.h - p.y),
                              w: 1, h: 1, color: p.color });
          if (player.blood.length > 90) player.blood.shift();
          particles.splice(i, 1);
          continue;
        }

        // Hit the floor: blood leaves a stain, giblets bounce then stop
        if (p.y >= FLOOR + 1) {
          if (p.giblet) {
            p.y = FLOOR + 1;
            p.vy = -p.vy * 0.3;
            p.vx *= 0.6;
            if (Math.abs(p.vy) < 10) { p.vy = 0; p.vx = 0; }
          } else {
            splatCtx.fillStyle = p.color;
            splatCtx.fillRect(Math.floor(p.x), FLOOR + Math.floor(Math.random() * 4), 2, 1);
            particles.splice(i, 1);
            continue;
          }
        }
        // Hit a wall (edge of the screen): leave a stain on the wall
        if (p.x < 0 || p.x > W) {
          splatCtx.fillStyle = p.color;
          splatCtx.fillRect(p.x < 0 ? 0 : W - 2, Math.floor(p.y), 2, 2);
          particles.splice(i, 1);
          continue;
        }
        if (p.life <= 0) {
          // Blood that was still in the air splats against the wall behind
          if (!p.giblet && Math.random() < 0.6 && p.y < FLOOR - 1) {
            splatCtx.fillStyle = p.color;
            splatCtx.fillRect(Math.floor(p.x), Math.floor(p.y), 1, Math.random() < 0.3 ? 2 : 1);
          }
          particles.splice(i, 1);
        }
      }
    }

    // ---------- Weapons ----------
    // Switch to a weapon on the scroll (wraps around at both ends)
    function selectWeapon(index) {
      const next = (index + WEAPONS.length) % WEAPONS.length;
      if (next !== player.weapon) {
        player.weapon = next;
        player.punchTime = 0;       // cancel a punch that was in progress
      }
    }

    function showMessage(text) {
      hudMessage = text;
      hudMessageTime = 1.5;
    }

    // Where the end of the gun barrel is (the pellets start here)
    function muzzle(p) {
      const fistY = p.crouching ? p.y + 14 : p.y + 18;
      return { x: Math.round(p.x) + (p.facing === 1 ? 42 : -16), y: Math.round(fistY) + 3 };
    }

    // Fire the shotgun: one blast sends out several pellets in a spread
    function shoot() {
      const p = player;
      if (p.shells <= 0) {
        showMessage("OUT OF SHELLS - SCROLL TO FISTS");
        sfx.empty();
        p.punchCooldown = 0.3;
        return;
      }
      p.shells--;
      sfx.shotgun();
      p.punchCooldown = 0.7;      // pumping the shotgun takes time
      p.flash = 0.06;
      p.recoil = 0.12;
      const m = muzzle(p);

      // Work out where to aim. A mouse click aims at the mouse.
      // The J key aims at the nearest alien in front, or straight ahead.
      let tx, ty;
      if (usedMouse) {
        tx = aimX + camX; ty = aimY;      // (add camX: the mouse is on screen, the room may be wider)
      } else {
        let nearest = null;
        for (const a of aliens) {
          const dx = a.x + a.w / 2 - m.x;
          if (Math.sign(dx) === p.facing &&
              (!nearest || Math.abs(dx) < Math.abs(nearest.x + nearest.w / 2 - m.x))) nearest = a;
        }
        tx = nearest ? nearest.x + nearest.w / 2 : m.x + p.facing * 100;
        ty = nearest ? nearest.y + nearest.h / 2 : m.y;
      }
      // Only the up/down angle is aimed; left/right comes from the way we face
      const run = Math.max(Math.abs(tx - m.x), 12);
      const angle = Math.max(-0.9, Math.min(0.9, Math.atan2(ty - m.y, run)));

      for (let i = 0; i < 7; i++) {
        const spread = angle + (Math.random() - 0.5) * 0.3;
        const speed = 380 + Math.random() * 60;
        pellets.push({
          x: m.x, y: m.y,
          vx: p.facing * Math.cos(spread) * speed,
          vy: Math.sin(spread) * speed,
          life: 0.3                  // pellets fade out, so the shotgun has a limited range
        });
      }

      p.vx = -p.facing * 70;         // recoil pushes the Sentinel back a little
      addShake(0.12, 2);
      // an empty shell pops out
      particles.push({ x: p.x + p.w / 2, y: p.y + 14, vx: -p.facing * 30, vy: -60,
                       life: 2.5, size: 1, color: "#c8a020", giblet: true });
    }

    function updatePellets(dt) {
      for (let i = pellets.length - 1; i >= 0; i--) {
        const b = pellets[i];
        // Move in small steps so a fast pellet cannot jump over an alien
        const steps = Math.ceil(Math.hypot(b.vx, b.vy) * dt / 4) || 1;
        let hit = false;
        for (let s = 0; s < steps && !hit; s++) {
          b.x += b.vx * dt / steps;
          b.y += b.vy * dt / steps;
          for (let j = aliens.length - 1; j >= 0; j--) {
            const a = aliens[j];
            if (b.x >= a.x - 1 && b.x <= a.x + a.w + 1 && b.y >= a.y - 1 && b.y <= a.y + a.h + 1) {
              const dir = Math.sign(b.vx);
              a.hp -= 10;                       // each pellet does 10 (an alien has 30)
              a.x += dir * 2;                   // pushes the alien back a little
              if (a.hp <= 0) {
                killAlien(j, dir);
                hitStop = Math.max(hitStop, 0.04);
                addShake(0.12, 2);
              } else {
                spawnBlood(b.x, b.y, dir, 4);
                if (animTime - lastHitSound > 0.06) { sfx.alienHit(); lastHitSound = animTime; }
              }
              hit = true;
              break;
            }
          }
        }
        b.life -= dt;
        if (hit || b.life <= 0 || b.x < -10 || b.x > W + 10 || b.y > FLOOR + 4 || b.y < -10) {
          pellets.splice(i, 1);
        }
      }
    }

    // A few drops of blood when an alien is hit but not killed
    function spawnBlood(x, y, dir, count) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x: x, y: y,
          vx: dir * (20 + Math.random() * 60),
          vy: -Math.random() * 60,
          life: 0.4 + Math.random() * 0.4,
          size: 1,
          color: Math.random() < 0.5 ? "#a01010" : "#c42020",
          giblet: false
        });
      }
    }

    // ---------- Blood on the Sentinel and on the walls ----------
    // Stains on the Sentinel are a list of tiny dots. Each dot remembers how far
    // across the body it is (dx) and how far up from the feet (up), so it moves
    // with the Sentinel. "side" is which way the blood came from (-1, 0 or 1).
    function addPlayerBlood(count, side) {
      const p = player;
      for (let i = 0; i < count; i++) {
        let dx = Math.random() * 24;
        if (side > 0) dx = 8 + Math.random() * 18;         // lean towards the side it came from
        if (side < 0) dx = -2 + Math.random() * 18;
        p.blood.push({
          dx: Math.floor(dx),
          up: 2 + Math.floor(Math.random() * 47),
          w: Math.random() < 0.3 ? 2 : 1,
          h: Math.random() < 0.3 ? 2 : 1,
          color: ["#7a0c0c", "#a01010", "#c42020"][Math.floor(Math.random() * 3)]
        });
      }
      if (p.blood.length > 90) p.blood.splice(0, p.blood.length - 90);   // keep it light
    }

    // Splatter on the wall behind an alien that has just died, with a few drips
    function wallSplash(x, y, dir, big) {
      const spots = big ? 40 : 22;
      for (let i = 0; i < spots; i++) {
        const sx = Math.floor(x + dir * (4 + Math.random() * 40) + (Math.random() - 0.5) * 24);
        const sy = Math.floor(y - Math.random() * 40);
        if (sx < 0 || sx >= W || sy < 0 || sy >= FLOOR - 1) continue;
        const size = Math.random() < 0.25 ? 3 : (Math.random() < 0.5 ? 2 : 1);
        splatCtx.fillStyle = ["#7a0c0c", "#a01010", "#c42020"][Math.floor(Math.random() * 3)];
        splatCtx.fillRect(sx, sy, size, size);
        if (Math.random() < 0.3) {                          // a drip running down the wall
          splatCtx.fillStyle = "#7a0c0c";
          splatCtx.fillRect(sx, sy + size, 1, Math.max(0, Math.min(3 + Math.floor(Math.random() * 7), FLOOR - 1 - sy - size)));
        }
      }
    }

    // Kill an alien (used by punches and by the shotgun)
    function killAlien(index, dir) {
      const a = aliens[index];
      sfx.alienDie();
      spawnGore(a.x + a.w / 2, a.y + a.h / 2, dir);   // gore flies away from the hit
      if (a.brute) spawnGore(a.x + a.w / 2, a.y + a.h / 2, dir);   // brutes make twice the mess
      wallSplash(a.x + a.w / 2, a.y, dir || 1, a.brute);           // blood on the wall behind
      // A close kill sprays blood onto the Sentinel too (the closer, the more)
      const centre = a.x + a.w / 2 - (player.x + player.w / 2);
      if (Math.abs(centre) < 60) {
        addPlayerBlood(2 + Math.round((60 - Math.abs(centre)) / 60 * (a.brute ? 26 : 14)), Math.sign(centre));
      }
      aliens.splice(index, 1);
      killed++;
      // Sometimes it drops a box of shotgun shells (brutes nearly always do)
      if (Math.random() < (a.brute ? 0.9 : 0.35)) {
        pickups.push({ x: a.x + a.w / 2 - 4, y: FLOOR - 6, w: 8, h: 6, life: 12 });
      }
    }

    // Shell boxes lie on the floor for a while; walk over one to pick it up
    function updatePickups(dt) {
      for (let i = pickups.length - 1; i >= 0; i--) {
        const s = pickups[i];
        s.life -= dt;
        if (overlaps(s, player)) {
          player.shells = Math.min(MAX_SHELLS, player.shells + 4);
          showMessage("+4 SHELLS");
          sfx.pickup();
          pickups.splice(i, 1);
        } else if (s.life <= 0) {
          pickups.splice(i, 1);
        }
      }
    }

    // ---------- Updating the game (runs every frame) ----------
    function update(dt) {
      if (hitStop > 0) { hitStop -= dt; return; }  // tiny freeze when a punch lands
      if (shake > 0) shake -= dt;
      updateParticles(dt);
      if (state === "dead") return;

      updatePlayer(dt);
      stompCheck();
      updateAliens(dt);
      updatePellets(dt);
      updatePickups(dt);

      // Bring in new aliens (a few at a time) until enough have been sent
      const room = ROOMS[roomIndex];
      spawnTimer -= dt;
      const sent = killed + aliens.length;
      if (spawnTimer <= 0 && aliens.length < room.maxAlive && sent < aliensToKill) {
        spawnAlien();
        spawnTimer = room.spawnEvery;
      }

      if (killed >= aliensToKill && aliens.length === 0) state = "cleared";
      if (player.hp <= 0) {
        player.hp = 0;
        state = "dead";
        sfx.death();
        spawnGore(player.x + 12, player.y + 20, 0);
      }
    }

    function updatePlayer(dt) {
      const p = player;
      const left = keys["KeyA"] || keys["ArrowLeft"];
      const right = keys["KeyD"] || keys["ArrowRight"];
      const jump = keys["KeyW"] || keys["ArrowUp"] || keys["Space"];

      // Crouching (hold C while on the ground). The feet stay where they are
      // and the Sentinel just gets shorter.
      const wantCrouch = !!keys["KeyC"] && p.onGround;
      if (wantCrouch !== p.crouching) {
        const feet = p.y + p.h;
        p.crouching = wantCrouch;
        p.h = wantCrouch ? CROUCH_HEIGHT : STAND_HEIGHT;
        p.y = feet - p.h;
      }

      // Walking: speed up and slow down gradually so the Sentinel feels heavy
      const maxSpeed = p.crouching ? 35 : 80;   // crouch-walking is slow
      if (left && !right)       { p.vx -= 500 * dt; p.facing = -1; }
      else if (right && !left)  { p.vx += 500 * dt; p.facing = 1; }
      else {
        // slow down when no key is held
        const slow = 600 * dt;
        if (Math.abs(p.vx) <= slow) p.vx = 0; else p.vx -= Math.sign(p.vx) * slow;
      }
      p.vx = Math.max(-maxSpeed, Math.min(maxSpeed, p.vx));

      // Jumping (heavy: strong gravity, so it is a short, quick hop)
      if (jump && p.onGround) {
        p.vy = -330;
        p.onGround = false;
        addShake(0.06, 1);                                  // small shake on take-off
        sfx.jump();
        spawnDust(p.x + p.w / 2, p.y + p.h, 6);
      }
      p.vy += 1100 * dt;

      // Move
      const wasOnGround = p.onGround;
      const fallSpeed = p.vy;                // how fast we were falling (for the landing)
      p.airborne = !wasOnGround;             // remembered so a stomp can be spotted this frame
      p.fallSpeed = fallSpeed;
      const oldBottom = p.y + p.h;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.x = Math.max(0, Math.min(W - p.w, p.x));

      // Land on the floor or on a platform
      p.onGround = false;
      if (p.y + p.h >= FLOOR) {
        p.y = FLOOR - p.h; p.vy = 0; p.onGround = true;
      } else if (p.vy >= 0) {
        for (const pl of platforms) {
          const overlapsX = p.x + p.w > pl.x && p.x < pl.x + pl.w;
          if (overlapsX && oldBottom <= pl.y + 1 && p.y + p.h >= pl.y) {
            p.y = pl.y - p.h; p.vy = 0; p.onGround = true;
          }
        }
      }

      // Heavy footsteps while walking on the ground (slower when crouching)
      if (p.onGround && Math.abs(p.vx) > 20) {
        p.stepTimer = (p.stepTimer || 0) - dt;
        if (p.stepTimer <= 0) {
          sfx.step();
          p.stepTimer = p.crouching ? 0.5 : 0.32;
        }
      } else {
        p.stepTimer = 0;
      }

      // Just landed? Shake the screen (harder for a longer fall) and kick up dust
      if (p.onGround && !wasOnGround && fallSpeed > 120) {
        addShake(0.12, fallSpeed > 300 ? 2 : 1);
        sfx.land(fallSpeed);
        spawnDust(p.x + p.w / 2, p.y + p.h, 10);
      }

      // Punching: wind-up, then a short moment where the fist can hit
      if (p.punchCooldown > 0) p.punchCooldown -= dt;
      if (p.hurtTime > 0) p.hurtTime -= dt;
      if (p.flash > 0) p.flash -= dt;
      if (p.recoil > 0) p.recoil -= dt;
      if (punchPressed && p.punchCooldown <= 0 && p.punchTime <= 0) {
        // If the player clicked, face the mouse
        if (usedMouse) p.facing = aimX + camX < p.x + p.w / 2 ? -1 : 1;
        if (p.weapon === 0) {
          p.punchTime = 0.001;
          p.punchCooldown = 0.4;
          p.punchHit = false;
          sfx.swing();
        } else {
          shoot();
        }
      }
      punchPressed = false;
      if (p.punchTime > 0) {
        p.punchTime += dt;
        const active = p.punchTime > 0.06 && p.punchTime < 0.18;
        if (active && !p.punchHit) doPunch();
        if (p.punchTime > 0.3) p.punchTime = 0;
      }
    }

    // Check which aliens the fist touches
    function doPunch() {
      const p = player;
      // The punch box sits in front of the Sentinel
      const fist = {
        x: p.facing === 1 ? p.x + p.w : p.x - 22,
        y: p.y + 14, w: 22, h: 36   // reaches down to the feet, because aliens are low
      };
      for (let i = aliens.length - 1; i >= 0; i--) {
        const a = aliens[i];
        if (overlaps(fist, a)) {
          p.punchHit = true;
          sfx.punchHit();
          a.hp -= 35;                      // 35 damage kills an alien (30 hp)
          if (a.hp <= 0) killAlien(i, p.facing);
          else a.x += p.facing * 6;         // a punch that does not kill still knocks it back
          hitStop = 0.06;                   // brief freeze = punch feels powerful
          addShake(0.15, 2);
        }
      }
    }

    // Stomp: landing on top of an alien squashes it, and the Sentinel bounces
    function stompCheck() {
      const p = player;
      if (!p.airborne || p.fallSpeed < 80) return;      // only works while falling
      const feet = p.y + p.h;
      for (let i = aliens.length - 1; i >= 0; i--) {
        const a = aliens[i];
        const above = p.x + p.w > a.x && p.x < a.x + a.w;   // lined up over the alien
        if (above && feet >= a.y - 2 && feet <= a.y + 12) {
          sfx.stomp();
          a.hp -= a.brute ? 60 : 999;           // a stomp kills a normal alien, but a brute survives one
          if (a.hp > 0) {
            spawnBlood(a.x + a.w / 2, a.y + 4, 1, 8);
            spawnBlood(a.x + a.w / 2, a.y + 4, -1, 8);
            a.attackCooldown = 0.7;             // stunned for a moment
          } else {
            killAlien(i, 1);                                // blood sprays out to the right...
            spawnGore(a.x + a.w / 2, a.y + a.h / 2, -1);    // ...and to the left
            wallSplash(a.x + a.w / 2, a.y, -1, true);       // a squashed alien splatters the wall too
          }
          for (let k = 0; a.hp <= 0 && k < 14; k++) {       // a puddle on the floor
            splatCtx.fillStyle = Math.random() < 0.5 ? "#8a1010" : "#a01010";
            splatCtx.fillRect(Math.floor(a.x - 6 + Math.random() * 28), FLOOR + Math.floor(Math.random() * 4), 2, 1);
          }
          p.vy = -230;                                      // bounce off
          p.onGround = false;
          hitStop = 0.07;
          addShake(0.18, 3);
        }
      }
    }

    function updateAliens(dt) {
      const p = player;
      for (const a of aliens) {
        a.wobble += dt * 12;
        // Run towards the Sentinel
        const dx = (p.x + p.w / 2) - (a.x + a.w / 2);
        if (Math.abs(dx) > 10) a.x += Math.sign(dx) * a.speed * dt;

        // Bite if touching the Sentinel
        if (a.attackCooldown > 0) a.attackCooldown -= dt;
        if (overlaps(a, p) && a.attackCooldown <= 0 && p.hurtTime <= 0) {
          p.hp -= a.damage;
          p.hurtTime = 0.5;
          a.attackCooldown = 0.8;
          sfx.hurt();
          p.vx = Math.sign(dx) * -60;    // small shove (the Sentinel is heavy, so it is small)
          addShake(0.1, 2);
        }
      }
    }

    // Do two boxes (x, y, w, h) overlap?
    function overlaps(a, b) {
      return a.x < b.x + b.w && a.x + a.w > b.x &&
             a.y < b.y + b.h && a.y + a.h > b.y;
    }

    // ---------- Drawing (runs every frame) ----------
    function draw() {
      ctx.save();
      if (shake > 0) {
        const s = shakePower * 2;
        ctx.translate(Math.round((Math.random() - 0.5) * s), Math.round((Math.random() - 0.5) * s));
      }
      ctx.translate(-Math.round(camX), 0);   // the camera: slide the room so the Sentinel stays in view

      drawBackground();
      ctx.drawImage(splat, 0, 0);          // blood stains
      for (const pl of platforms) drawPlatform(pl);
      drawPickups();
      for (const a of aliens) drawAlien(a);
      if (state !== "dead") { drawSentinel(); drawPlayerBlood(); }
      drawParticles();
      drawPellets();
      ctx.restore();

      ctx.drawImage(vignette, 0, 0);       // dark edges, so the room feels gloomy
      drawHud();
    }

    // An observation window with a glowing alien nest inside (x, y = top left corner)
    function drawWindow(x, y) {
      ctx.fillStyle = "#26302a";
      ctx.fillRect(x, y, 104, 46);
      ctx.fillStyle = "#0a100c";
      ctx.fillRect(x + 2, y + 2, 100, 42);
      ctx.fillStyle = "#12261a";
      ctx.fillRect(x + 2, y + 28, 100, 16);
      const glow = 0.5 + 0.5 * Math.sin(animTime * 2);     // slow pulsing
      ctx.fillStyle = glow > 0.5 ? "#2f6a2a" : "#285a24";
      ctx.fillRect(x + 22, y + 22, 12, 14);
      ctx.fillRect(x + 42, y + 16, 14, 20);
      ctx.fillRect(x + 68, y + 24, 10, 12);
      ctx.fillStyle = "#4c9a3c";
      ctx.fillRect(x + 46, y + 18, 3, 3);
      ctx.fillStyle = "#e8c020";                            // a yellow eye in the dark
      ctx.fillRect(x + 86, y + 12, 2, 2);
      ctx.fillStyle = "#26302a";
      ctx.fillRect(x + 50, y + 2, 4, 42);                   // window frame
      ctx.fillStyle = "#3a463a";
      ctx.fillRect(x + 2, y + 2, 100, 1);                   // glass shine
    }

    // A computer terminal with a flickering screen (x, y = top left corner)
    function drawTerminal(x, y) {
      ctx.fillStyle = "#222c25";
      ctx.fillRect(x, y, 22, 32);
      ctx.fillStyle = "#0a100c";
      ctx.fillRect(x + 3, y + 3, 16, 12);
      ctx.fillStyle = Math.sin(animTime * 9) > -0.6 ? "#2f8a3a" : "#1a4a20";
      ctx.fillRect(x + 5, y + 6, 8, 1);
      ctx.fillRect(x + 5, y + 9, 11, 1);
      ctx.fillRect(x + 5, y + 12, 6, 1);
      ctx.fillStyle = "#38453b";
      ctx.fillRect(x, y, 22, 1);
      ctx.fillStyle = "#a01010";                            // warning light
      ctx.fillRect(x + 17, y + 20, 2, 2);
    }

    function drawBackground() {
      const room = ROOMS[roomIndex];

      // Wall: darker at the top, lighter lower down (drawn in five bands)
      const bandH = FLOOR / room.wall.length;
      for (let i = 0; i < room.wall.length; i++) {
        ctx.fillStyle = room.wall[i];
        ctx.fillRect(0, Math.floor(i * bandH), W, Math.ceil(bandH) + 1);
      }

      // Wall panels with seams and rivets
      for (let x = 0; x < W; x += 64) {
        ctx.fillStyle = "#101712";
        ctx.fillRect(x, 0, 2, FLOOR);
        ctx.fillStyle = "#2a352d";
        ctx.fillRect(x + 2, 0, 1, FLOOR);
        ctx.fillStyle = "#2c382f";
        for (let y = 40; y < FLOOR; y += 36) {
          ctx.fillRect(x + 8, y, 2, 2);
          ctx.fillRect(x + 54, y, 2, 2);
        }
      }

      // Pipes running along the wall (a second one lower down in tall rooms)
      for (let py = 22; py < FLOOR - 40; py += FLOOR > 200 ? 90 : 200) {
        ctx.fillStyle = "#222c25";
        ctx.fillRect(0, py, W, 6);
        ctx.fillStyle = "#38453b";
        ctx.fillRect(0, py, W, 1);
        ctx.fillStyle = "#161d18";
        ctx.fillRect(0, py + 5, W, 1);
        ctx.fillStyle = "#2c382f";
        for (let x = 20; x < W; x += 56) ctx.fillRect(x, py - 2, 4, 10);   // pipe joints
      }

      // Windows and terminals repeat every 320 pixels along the room
      const windowY = Math.round(FLOOR * 0.25);
      for (let x = 0; x < W; x += 320) {
        drawWindow(x + 108, windowY);
        drawTerminal(x + 8, FLOOR - 32);
      }

      // Big patches of alien growth on the walls (only in the infested rooms)
      if (room.infested) {
        for (let x = 150; x < W; x += 210) {
          const top = FLOOR - 95 - ((x * 7) % 25);
          ctx.fillStyle = "#1f4a1c";
          ctx.fillRect(x, top, 34, FLOOR - top - 6);
          ctx.fillRect(x - 8, top + 20, 50, 20);
          ctx.fillStyle = "#2f6a2a";
          ctx.fillRect(x + 6, top + 6, 22, FLOOR - top - 24);
          ctx.fillStyle = "#4c9a3c";
          ctx.fillRect(x + 12, top + 14, 4, 4);
          ctx.fillRect(x + 20, top + 30, 3, 3);
          ctx.fillStyle = Math.sin(animTime * 3 + x) > 0 ? "#e8c020" : "#a08818";   // watching eyes
          ctx.fillRect(x + 10, top + 24, 2, 2);
          ctx.fillRect(x + 22, top + 24, 2, 2);
        }
      }

      // Green alien growth hanging from the ceiling
      ctx.fillStyle = "#2f6a2a";
      for (let x = 0; x < W; x += 20) {
        const len = 8 + ((x * 7) % 23);
        ctx.fillRect(x, 0, 6, len);
        ctx.fillRect(x + 2, len, 2, 4);
      }
      ctx.fillStyle = "#4c9a3c";
      for (let x = 10; x < W; x += 40) ctx.fillRect(x, 0, 3, 6 + ((x * 3) % 10));

      // Slime drips falling from the growth
      ctx.fillStyle = "#6ac04a";
      for (let i = 0; i < Math.floor(W / 70); i++) {
        const dripX = 52 + i * 70;
        const dripY = (animTime * 45 + i * 41) % (FLOOR - 24) + 24;
        ctx.fillRect(dripX, Math.round(dripY), 1, 2);
      }

      // Warning stripe along the bottom of the wall
      for (let x = 0; x < W; x += 16) {
        ctx.fillStyle = "#8a7a20";
        ctx.fillRect(x, FLOOR - 5, 8, 4);
        ctx.fillStyle = "#1a1a14";
        ctx.fillRect(x + 8, FLOOR - 5, 8, 4);
      }

      // Metal floor: plates with seams and a grating strip
      ctx.fillStyle = "#3a403c";
      ctx.fillRect(0, FLOOR, W, H - FLOOR);
      ctx.fillStyle = "#555e57";
      ctx.fillRect(0, FLOOR, W, 1);
      ctx.fillStyle = "#2a302c";
      for (let x = 0; x < W; x += 32) ctx.fillRect(x, FLOOR + 1, 1, H - FLOOR);
      ctx.fillStyle = "#2a302c";
      ctx.fillRect(0, FLOOR + 14, W, 1);
      for (let x = 0; x < W; x += 4) ctx.fillRect(x, FLOOR + 20, 2, 8);   // grating
    }

    function drawPlatform(pl) {
      ctx.fillStyle = "#1a201a";              // dark underside / shadow
      ctx.fillRect(pl.x, pl.y + 4, pl.w, 2);
      ctx.fillStyle = "#4a524c";              // metal body
      ctx.fillRect(pl.x, pl.y, pl.w, 4);
      ctx.fillStyle = "#6a746c";              // bright top edge
      ctx.fillRect(pl.x, pl.y, pl.w, 1);
      ctx.fillStyle = "#2a302c";              // rivets
      for (let x = pl.x + 4; x < pl.x + pl.w - 2; x += 10) ctx.fillRect(x, pl.y + 2, 2, 1);
      ctx.fillStyle = "#2f6a2a";              // green growth on top and hanging below
      ctx.fillRect(pl.x + 4, pl.y - 1, 14, 1);
      ctx.fillRect(pl.x + pl.w - 20, pl.y - 1, 10, 1);
      ctx.fillRect(pl.x + 10, pl.y + 6, 2, 5);
      ctx.fillRect(pl.x + pl.w - 14, pl.y + 6, 2, 8);
    }

    function drawSentinel() {
      const p = player;
      // Flash when hurt
      if (p.hurtTime > 0 && Math.floor(p.hurtTime * 20) % 2 === 0) return;
      const x = Math.round(p.x), y = Math.round(p.y);
      const crouch = p.crouching;
      const feet = y + p.h;
      const legTop = crouch ? y + 22 : y + 36;
      const torsoTop = crouch ? y + 9 : y + 12;
      const torsoH = legTop - torsoTop + 2;

      // Shadow on the ground
      ctx.fillStyle = "rgba(0,0,0,0.4)";
      ctx.fillRect(x - 2, feet - 1, 28, 2);

      // Legs (dark outline, then armour, knee pad and boot)
      ctx.fillStyle = "#1a201a";
      ctx.fillRect(x + 2, legTop, 10, feet - legTop);
      ctx.fillRect(x + 12, legTop, 10, feet - legTop);
      ctx.fillStyle = "#3d4a3d";
      ctx.fillRect(x + 3, legTop, 8, feet - legTop - 1);
      ctx.fillRect(x + 13, legTop, 8, feet - legTop - 1);
      ctx.fillStyle = "#5a665a";
      ctx.fillRect(x + 4, legTop + (crouch ? 1 : 3), 6, 2);
      ctx.fillRect(x + 14, legTop + (crouch ? 1 : 3), 6, 2);
      ctx.fillStyle = "#1a201a";
      ctx.fillRect(x + 2, feet - 3, 10, 3);
      ctx.fillRect(x + 12, feet - 3, 10, 3);

      // Torso: outline, armour, bright top, dark bottom, chest plate
      ctx.fillStyle = "#1a201a";
      ctx.fillRect(x - 1, torsoTop - 1, 26, torsoH + 2);
      ctx.fillStyle = "#5a665a";
      ctx.fillRect(x, torsoTop, 24, torsoH);
      ctx.fillStyle = "#74827a";
      ctx.fillRect(x, torsoTop, 24, 2);
      ctx.fillStyle = "#3d4a3d";
      ctx.fillRect(x, torsoTop + torsoH - 3, 24, 3);
      ctx.fillStyle = "#3f5a3f";
      ctx.fillRect(x + 6, torsoTop + 4, 12, torsoH - 9);
      ctx.fillStyle = "#6a8a5a";
      ctx.fillRect(x + 6, torsoTop + 4, 12, 1);
      ctx.fillStyle = "#c8b840";               // little status light
      ctx.fillRect(x + 11, torsoTop + 6, 2, 2);

      // Shoulder plates
      ctx.fillStyle = "#1a201a";
      ctx.fillRect(x - 4, torsoTop - 1, 10, 11);
      ctx.fillRect(x + 18, torsoTop - 1, 10, 11);
      ctx.fillStyle = "#74827a";
      ctx.fillRect(x - 3, torsoTop, 8, 9);
      ctx.fillRect(x + 19, torsoTop, 8, 9);
      ctx.fillStyle = "#8a9890";
      ctx.fillRect(x - 3, torsoTop, 8, 2);
      ctx.fillRect(x + 19, torsoTop, 8, 2);

      // Helmet and glowing visor (on the side the Sentinel faces)
      ctx.fillStyle = "#1a201a";
      ctx.fillRect(x + 3, y - 1, 18, 16);
      ctx.fillStyle = "#3d4a3d";
      ctx.fillRect(x + 4, y, 16, 14);
      ctx.fillStyle = "#5a665a";
      ctx.fillRect(x + 4, y, 16, 2);
      const visorX = p.facing === 1 ? x + 11 : x + 4;
      ctx.fillStyle = "#101410";
      ctx.fillRect(visorX, y + 4, 9, 4);
      ctx.fillStyle = "#3aa04a";
      ctx.fillRect(visorX + 1, y + 5, 7, 1);

      const fistY = crouch ? y + 14 : y + 18;

      // Holding the shotgun: draw the gun in front instead of a fist
      if (p.weapon === 1) {
        const kick = p.recoil > 0 ? 2 : 0;               // the gun jerks back after a shot
        const gx = p.facing === 1 ? x + 20 - kick : x - 16 + kick;
        ctx.fillStyle = "#101410";                        // outline
        ctx.fillRect(gx - 1, fistY, 24, 7);
        ctx.fillStyle = "#2a302c";                        // barrel
        ctx.fillRect(gx, fistY + 1, 22, 4);
        ctx.fillStyle = "#5a645c";                        // shine on the barrel
        ctx.fillRect(gx, fistY + 1, 22, 1);
        ctx.fillStyle = "#6a4a2a";                        // wooden pump
        ctx.fillRect(p.facing === 1 ? gx + 5 : gx + 9, fistY + 5, 8, 2);
        ctx.fillStyle = "#74827a";                        // armoured hand
        ctx.fillRect(p.facing === 1 ? gx + 1 : gx + 15, fistY + 1, 6, 6);
        if (p.flash > 0) {                                // muzzle flash
          const m = muzzle(p);
          const fx = p.facing === 1 ? m.x : m.x - 9;
          ctx.fillStyle = "#ff9020";
          ctx.fillRect(fx, m.y - 3, 9, 7);
          ctx.fillStyle = "#fff0a0";
          ctx.fillRect(fx + 1, m.y - 1, 7, 3);
        }
        return;
      }

      // Arm and fist: the fist shoots out in front while punching
      let reach = 0;
      if (p.punchTime > 0) reach = p.punchTime > 0.06 && p.punchTime < 0.18 ? 22 : 8;
      const fistX =p.facing === 1 ? x + 22 + reach : x + 2 - reach - 6;
      ctx.fillStyle = "#3d4a3d";
      if (p.facing === 1) ctx.fillRect(x + 20, fistY + 2, reach + 4, 4);
      else ctx.fillRect(fistX + 6, fistY + 2, reach + 4, 4);
      ctx.fillStyle = "#1a201a";
      ctx.fillRect(fistX - 1, fistY - 1, 10, 10);
      ctx.fillStyle = "#74827a";
      ctx.fillRect(fistX, fistY, 8, 8);
      ctx.fillStyle = "#8a9890";
      ctx.fillRect(fistX, fistY, 8, 2);
    }

    // Colours for the two kinds of alien
    const ALIEN_COLOURS = {
      legs: "#5a0808", outline: "#8a1010", body: "#c42020", light: "#e04040",
      shade: "#7a0c0c", spine: "#5a0808", head: "#c42020", eye: "#f8d820"
    };
    const BRUTE_COLOURS = {      // darker and heavier
      legs: "#2a0404", outline: "#4a0808", body: "#8a1414", light: "#b02828",
      shade: "#4a0808", spine: "#220303", head: "#8a1414", eye: "#ffb020"
    };

    // Aliens are drawn as if they were 16x14, then scaled up (brutes are scaled by 2)
    function drawAlien(a) {
      const col = a.brute ? BRUTE_COLOURS : ALIEN_COLOURS;
      const step = Math.floor(a.wobble) % 2;         // makes the legs shuffle
      const f = player.x + player.w / 2 > a.x + a.w / 2 ? 1 : -1;   // which way it faces

      ctx.save();
      ctx.translate(Math.round(a.x), Math.round(a.y));
      ctx.scale(a.scale, a.scale);
      const x = 0, y = 0;

      ctx.fillStyle = "rgba(0,0,0,0.4)";              // shadow
      ctx.fillRect(x, y + 13, 16, 2);

      ctx.fillStyle = col.legs;                       // long bent legs
      ctx.fillRect(x + 1 + step, y + 9, 2, 5);
      ctx.fillRect(x + 5 - step, y + 9, 2, 5);
      ctx.fillRect(x + 9 + step, y + 9, 2, 5);
      ctx.fillRect(x + 13 - step, y + 9, 2, 5);
      ctx.fillStyle = "#d8d0b8";                      // claws
      ctx.fillRect(x + 1 + step, y + 13, 1, 1);
      ctx.fillRect(x + 5 - step, y + 13, 1, 1);
      ctx.fillRect(x + 9 + step, y + 13, 1, 1);
      ctx.fillRect(x + 13 - step, y + 13, 1, 1);

      ctx.fillStyle = col.spine;                      // spines along the back
      for (let k = 0; k < 3; k++) {
        ctx.fillRect(f === 1 ? x + 1 + k * 3 : x + 14 - k * 3, y + 1 + (k % 2), 1, 3);
      }

      ctx.fillStyle = col.outline;                    // body outline
      ctx.fillRect(x, y + 3, 16, 8);
      ctx.fillStyle = col.body;                       // body
      ctx.fillRect(x + 1, y + 4, 14, 6);
      ctx.fillStyle = col.light;                      // highlight on top
      ctx.fillRect(x + 2, y + 4, 12, 1);
      ctx.fillStyle = col.shade;                      // shaded underside
      ctx.fillRect(x + 1, y + 9, 14, 1);

      const headX = f === 1 ? x + 10 : x;             // head
      ctx.fillStyle = col.outline;
      ctx.fillRect(headX, y, 6, 8);
      ctx.fillStyle = col.head;
      ctx.fillRect(headX + 1, y + 1, 4, 6);
      ctx.fillStyle = "#d8d0b8";                      // mandibles
      ctx.fillRect(f === 1 ? headX + 6 : headX - 2, y + 6, 2, 2);
      ctx.fillStyle = col.eye;                        // glowing eye
      ctx.fillRect(f === 1 ? headX + 3 : headX + 1, y + 2, 2, 2);
      ctx.fillStyle = "#fff8b0";
      ctx.fillRect(f === 1 ? headX + 4 : headX + 1, y + 2, 1, 1);
      ctx.restore();

      // Brutes show a small health bar once they have been hurt
      if (a.brute && a.hp < a.maxHp) {
        ctx.fillStyle = "#000";
        ctx.fillRect(Math.round(a.x), Math.round(a.y) - 5, a.w, 3);
        ctx.fillStyle = "#c42020";
        ctx.fillRect(Math.round(a.x) + 1, Math.round(a.y) - 4, Math.round((a.w - 2) * a.hp / a.maxHp), 1);
      }
    }

    function drawParticles() {
      for (const p of particles) {
        ctx.fillStyle = p.color;
        ctx.fillRect(Math.round(p.x), Math.round(p.y), p.size, p.size);
      }
    }

    // Blood stains on the Sentinel's armour, drawn on top of the body
    function drawPlayerBlood() {
      const p = player;
      if (p.hurtTime > 0 && Math.floor(p.hurtTime * 20) % 2 === 0) return;   // hidden while the Sentinel flashes
      const x = Math.round(p.x), feet = Math.round(p.y + p.h);
      for (const b of p.blood) {
        if (b.up > p.h) continue;                // stains up high are hidden while crouching
        ctx.fillStyle = b.color;
        ctx.fillRect(x + b.dx, feet - b.up, b.w, b.h);
      }
    }

    // Shotgun pellets are small bright dots
    function drawPellets() {
      ctx.fillStyle = "#ffe070";
      for (const b of pellets) ctx.fillRect(Math.round(b.x), Math.round(b.y), 2, 1);
    }

    // Boxes of shells on the floor (they blink just before they disappear)
    function drawPickups() {
      for (const s of pickups) {
        if (s.life < 3 && Math.floor(s.life * 6) % 2 === 0) continue;
        ctx.fillStyle = "#101410";
        ctx.fillRect(s.x - 1, s.y - 1, s.w + 2, s.h + 2);
        ctx.fillStyle = "#a01010";
        ctx.fillRect(s.x, s.y, s.w, s.h);
        ctx.fillStyle = "#d8b020";               // brass ends of the shells
        ctx.fillRect(s.x + 1, s.y + 4, s.w - 2, 2);
        ctx.fillStyle = "#e04040";
        ctx.fillRect(s.x, s.y, s.w, 1);
      }
    }

    // The weapon scroll: the only inventory. The selected weapon is highlighted.
    function drawWeaponScroll() {
      const slotW = 62, gap = 3, y = H - 17;
      let x = Math.round((VW - (WEAPONS.length * slotW + (WEAPONS.length - 1) * gap)) / 2);
      ctx.font = "7px monospace";
      for (let i = 0; i < WEAPONS.length; i++) {
        const selected = i === player.weapon;
        ctx.fillStyle = selected ? "#7ac05a" : "#3a463a";    // border
        ctx.fillRect(x, y, slotW, 14);
        ctx.fillStyle = "#0a100c";
        ctx.fillRect(x + 1, y + 1, slotW - 2, 12);
        ctx.textAlign = "left";
        ctx.fillStyle = selected ? "#d8e8d0" : "#7a867a";
        ctx.fillText((i + 1) + " " + WEAPONS[i], x + 4, y + 9);
        if (i === 1) {                                         // ammunition for the shotgun
          ctx.textAlign = "right";
          ctx.fillStyle = player.shells > 0 ? "#e8c020" : "#c42020";
          ctx.fillText(String(player.shells), x + slotW - 4, y + 9);
        }
        x += slotW + gap;
      }
      if (hudMessageTime > 0) {
        ctx.textAlign = "center";
        ctx.fillStyle = "#e8c020";
        ctx.fillText(hudMessage, VW / 2, H - 22);
      }
    }

    function drawHud() {
      drawWeaponScroll();

      // Health bar (turns red when low)
      ctx.fillStyle = "#3a463a";
      ctx.fillRect(5, 5, 64, 10);
      ctx.fillStyle = "#000";
      ctx.fillRect(6, 6, 62, 8);
      ctx.fillStyle = player.hp > 35 ? "#4a9a3a" : "#c42020";
      ctx.fillRect(8, 8, Math.round(58 * player.hp / 100), 4);
      ctx.fillStyle = "rgba(255,255,255,0.25)";
      ctx.fillRect(8, 8, Math.round(58 * player.hp / 100), 1);

      // Room name in the middle, kill counter on the right
      ctx.font = "8px monospace";
      ctx.fillStyle = "#7a867a";
      ctx.textAlign = "center";
      ctx.fillText(ROOMS[roomIndex].name, VW / 2, 12);
      ctx.fillStyle = "#b8c4b0";
      ctx.textAlign = "right";
      ctx.fillText("ALIENS " + killed + "/" + aliensToKill, VW - 6, 12);

      // Messages in the middle of the screen
      if (state !== "play") {
        const mid = Math.round(H / 2);
        const lastRoom = roomIndex === ROOMS.length - 1;
        ctx.fillStyle = "rgba(0,0,0,0.6)";
        ctx.fillRect(0, mid - 30, VW, 50);
        ctx.textAlign = "center";
        ctx.fillStyle = state === "dead" ? "#c42020" : "#7ac05a";
        ctx.font = "16px monospace";
        let title = "SENTINEL DOWN", hint = "Press R to try again";
        if (state === "cleared") {
          title = lastRoom ? "ALL ROOMS CLEARED" : "ROOM CLEARED";
          hint = lastRoom ? "Press R to play again" : "Press ENTER for the next room";
        }
        ctx.fillText(title, VW / 2, mid - 6);
        ctx.fillStyle = "#b8c4b0";
        ctx.font = "8px monospace";
        ctx.fillText(hint, VW / 2, mid + 10);
      }
    }

    // ---------- The game loop ----------
    let lastTime = performance.now();
    function loop(now) {
      const dt = Math.min((now - lastTime) / 1000, 0.05);  // seconds since last frame
      lastTime = now;
      animTime += dt;
      if (hudMessageTime > 0) hudMessageTime -= dt;
      update(dt);
      updateCamera(dt);
      draw();
      requestAnimationFrame(loop);
    }

    startGame();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
